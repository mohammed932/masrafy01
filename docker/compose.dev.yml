services:
  postgres:
    image: postgres:16-alpine
    container_name: masrafy_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: masrafy
      POSTGRES_PASSWORD: masrafy
      POSTGRES_DB: masrafy_dev
    ports:
      - "5432:5432"
    volumes:
      - masrafy_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masrafy -d masrafy_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: masrafy_redis_dev
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: masrafy_minio_dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - masrafy_minio_dev:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates the dev bucket the backend presigns against (S3_BUCKET in
  # backend/.env). Without this a fresh `masrafy_minio_dev` volume has no bucket,
  # so presigned PUTs from the app fail with NoSuchBucket while the presign call
  # itself still returns 200 (getSignedUrl is offline). Runs once and exits.
  createbuckets:
    image: minio/mc:latest
    container_name: masrafy_createbuckets_dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/masrafy-documents-development &&
      echo 'bucket ready: masrafy-documents-development'
      "

volumes:
  masrafy_pg_dev:
  masrafy_minio_dev:
