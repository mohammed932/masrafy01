openapi: 3.1.0
info:
  title: Masrafy Loan Apply
  version: 1.0.0
paths:
  /api/v1/applications/apply:
    post:
      summary: Atomic loan-application submission
      description: |
        Single-transaction submission. The customer must already have a
        COMPLETE profile (firstName, lastName, birthday, profilePhotoKey,
        verified mobile, and both National ID Documents; PHONE also a
        password). An incomplete profile is rejected with PROFILE_INCOMPLETE
        — this endpoint never mutates customer profile fields.

        The request carries only the offer selection, questionnaire payload,
        and document IDs. Apply BINDS the customer's pre-existing
        National ID Documents (uploaded earlier at profile completion,
        customerId set / applicationId null) to the new application; it does
        NOT accept new uploads.
      security: [{ CustomerJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offerSelection, questionnaire, documents]
              properties:
                offerSelection:
                  type: object
                  required: [bankProgramId, currency, tenorMonths]
                  properties:
                    bankProgramId: { type: string }
                    currency: { type: string, enum: [EGP] }
                    tenorMonths: { type: integer, minimum: 6, maximum: 360 }
                questionnaire:
                  type: object
                  required: [loanType, amountRequested, monthlySalary, employmentType, priorityFactor]
                  properties:
                    loanType: { type: string, enum: [personal, car, mortgage, business] }
                    amountRequested: { type: string, description: Decimal as string }
                    monthlySalary: { type: string, description: Decimal as string }
                    employmentType: { type: string }
                    currentLoans: { type: string, description: Decimal as string }
                    priorityFactor: { type: string, enum: [lowest_installment, lowest_rate, fastest_approval] }
                documents:
                  type: object
                  required: [nationalIdFrontUploadId, nationalIdBackUploadId]
                  properties:
                    nationalIdFrontUploadId: { type: string }
                    nationalIdBackUploadId: { type: string }
      responses:
        '200':
          description: Application submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      customer:
                        type: object
                        description: The (unchanged) complete customer envelope
                      application:
                        type: object
                        properties:
                          id: { type: string }
                          status: { type: string, const: submitted }
                          bankProgramId: { type: string }
                          submittedAt: { type: string, format: date-time }
        '400':
          description: |
            PROFILE_INCOMPLETE (customer profile not finalized — must
            complete the profile-completion step first),
            DOCUMENTS_MISSING, BANK_PROGRAM_INVALID
        '403':
          description: DOCUMENTS_NOT_OWNED
        '409':
          description: |
            Rare race conditions (e.g. the bank program became invalid
            between matching and submit). meta carries the specific issue.

components:
  securitySchemes:
    CustomerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
