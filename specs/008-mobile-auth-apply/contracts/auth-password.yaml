openapi: 3.1.0
info:
  title: Masrafy Mobile Auth — Password
  version: 1.0.0
paths:
  /api/v1/auth/password/reset:
    post:
      summary: Reset password using a forgot-password OTP
      description: |
        Consumes a passwordResetToken (issued by /auth/otp/verify with
        purpose=FORGOT_PASSWORD). Sets a new password, revokes ALL other
        refresh tokens for the customer, and issues fresh tokens to the
        requesting device. PHONE customers only — for SOCIAL customers the
        OTP-verify step returns the same generic outcome but never issues a
        passwordResetToken (per FR-024).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passwordResetToken, newPassword]
              properties:
                passwordResetToken: { type: string }
                newPassword:
                  type: string
                  description: min 8 chars, ≥1 letter, ≥1 digit
      responses:
        '200':
          description: Password reset, customer signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '400':
          description: PASSWORD_WEAK
        '401':
          description: Token invalid / expired / consumed

  /api/v1/auth/password/change:
    post:
      summary: Authenticated password change (PHONE customers only)
      security: [{ CustomerJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        '204':
          description: Password changed, other refresh tokens revoked, caller re-issued
        '400':
          description: PASSWORD_WEAK / PASSWORD_SAME_AS_OLD
        '401':
          description: CURRENT_PASSWORD_INVALID
        '403':
          description: Forbidden — caller is a SOCIAL customer (no password set)

components:
  schemas:
    AuthEnvelope:
      type: object
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          properties:
            accessToken: { type: string }
            refreshToken: { type: string }
            accessTokenExpiresAt: { type: string, format: date-time }
            refreshTokenExpiresAt: { type: string, format: date-time }
            customer:
              type: object
              properties:
                id: { type: string }
                hasPassword: { type: boolean, const: true }
  securitySchemes:
    CustomerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
