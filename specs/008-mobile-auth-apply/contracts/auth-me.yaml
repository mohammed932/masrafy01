openapi: 3.1.0
info:
  title: Masrafy Mobile Auth — Me
  version: 1.0.0
paths:
  /api/v1/auth/me:
    get:
      summary: Return the authenticated customer's profile
      security: [{ CustomerJWT: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      registrationPath: { type: string, enum: [PHONE, SOCIAL] }
                      mobile: { type: string, nullable: true }
                      mobileVerifiedAt: { type: string, format: date-time, nullable: true }
                      firstName: { type: string, nullable: true }
                      lastName: { type: string, nullable: true }
                      email: { type: string, nullable: true }
                      birthday: { type: string, format: date, nullable: true }
                      profilePhotoKey: { type: string, nullable: true }
                      hasPassword: { type: boolean }
                      linkedProviders:
                        type: array
                        items: { type: string, enum: [GOOGLE, APPLE] }
                      profileComplete:
                        type: boolean
                        description: |
                          true once the full completeness contract is met.
                      requiresProfileCompletion:
                        type: boolean
                        description: |
                          Inverse of profileComplete. true while ANY of the
                          completeness fields is missing: firstName, lastName,
                          birthday, profilePhotoKey, verified mobile
                          (mobileVerifiedAt), and the two National ID
                          Documents (front + back). PHONE customers also
                          require passwordHash. Mobile clients route to the
                          mandatory profile-completion flow while true.

components:
  securitySchemes:
    CustomerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
