# Static SPA server for the Angular admin dashboard.
# SSL is terminated upstream by nginx-proxy; this server speaks plain HTTP on :80
# inside the `web` network.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Hashed, immutable build assets — cache hard.
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|map)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must never be cached (so new deploys are picked up immediately).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # SPA client-side routing fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
